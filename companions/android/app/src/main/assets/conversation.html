.activity.busy::before{content:"";display:inline-block;width:10px;height:10px;border:2px solid #596be0;border-top-color:#d0d6ff;border-radius:50%;margin-right:8px;vertical-align:middle;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="shell"><header><div class="brand"><div class="mark" aria-hidden="true">?</div><div><h1>Ultimate Assistant</h1><div class="sub">Your assistant, across devices</div></div></div><button id="settings" class="icon-button" aria-label="Phone settings">?</button></header><div id="status" class="status" role="status">Connecting...</div><div id="activity" class="activity" role="status" hidden></div><section id="presentation" class="presentation" aria-label="Context" hidden><div id="presentation-kind" class="presentation-kind"></div><h2 id="presentation-title"></h2><div id="presentation-content" class="message-content"></div></section><section id="chat" class="chat" aria-label="Conversation"><div class="welcome">Message your assistant below.</div></section></main><script>
'use strict';
// Established parsers are packaged with the app; nothing is fetched while chatting.
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mathExtension(name,level,pattern,display){return {name,level,start(src){const index=src.search(/\\[\[(]|\$/);return index<0?undefined:index;},tokenizer(src){const match=pattern.exec(src);if(match)return {type:name,raw:match[0],math:match[1],display};},renderer(token){return '<span class="math-source" data-display="'+token.display+'" data-math="'+escapeHtml(token.math)+'">'+escapeHtml(token.raw)+'</span>';}};}
if(window.marked)marked.use({extensions:[
 mathExtension('displayMath','block',/^\$\$\s*([\s\S]+?)\s*\$\$(?:\n|$)/,true),
 mathExtension('bracketMath','inline',/^\\\[([\s\S]+?)\\\]/,true),
 mathExtension('inlineMath','inline',/^\\\(([\s\S]+?)\\\)/,false),
 mathExtension('dollarMath','inline',/^\$(?![\d\s$])([^\n$]+?\S|[^\d\s$])\$(?!\d)/,false)
]});
function renderContent(content,target){
 if(!window.marked||!window.DOMPurify){target.textContent=content;return;}
 try{
  target.innerHTML=DOMPurify.sanitize(marked.parse(content,{gfm:true,breaks:true}),{
   ALLOWED_TAGS:['p','br','strong','em','del','h1','h2','h3','h4','h5','h6','ul','ol','li','blockquote','pre','code','table','thead','tbody','tr','th','td','hr','span','a','input'],
   ALLOWED_ATTR:['class','data-math','data-display','start','type','checked','disabled','title'],
   ALLOW_DATA_ATTR:false

  target.querySelectorAll('a').forEach(link=>link.removeAttribute('href'));
  target.querySelectorAll('input').forEach(input=>{input.disabled=true;input.type='checkbox';});
  target.querySelectorAll('table').forEach(table=>{const scroll=document.createElement('div');scroll.className='table-scroll';table.replaceWith(scroll);scroll.appendChild(table);});
  if(window.katex)target.querySelectorAll('.math-source').forEach(node=>{
   try{katex.render(node.dataset.math,node,{displayMode:node.dataset.display==='true',throwOnError:false,trust:false,strict:'ignore',maxExpand:500,maxSize:20});}catch(_){/* Preserve readable source on unsupported notation. */}
  });

const chat=document.getElementById('chat');
const records=[];

function drawMessage(message){

 const content=document.createElement('div');content.className='message-content';

};
