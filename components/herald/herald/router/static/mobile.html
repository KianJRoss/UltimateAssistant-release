<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#07111f">
  <title>Herald Chat</title>
  <link rel="stylesheet" href="/static/herald-ui.css">
  <style>
    :root { color-scheme:dark; --bg:#06101d; --panel:#0b1827; --panel2:#112237; --line:#263b52; --text:#ecf3fa; --muted:#8492a6; --accent:#52d6ff; --accent2:#0b7184; --vh:100dvh; --vw:100vw; --vtop:0px; --vleft:0px; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-width:0; max-width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    button,textarea,select,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    #app { position:fixed; top:var(--vtop); left:var(--vleft); width:var(--vw); max-width:100%; height:var(--vh); overflow:hidden; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; background:radial-gradient(circle at 50% -20%,#11334a 0,transparent 42%),var(--bg); }
    header { width:100%; min-width:0; max-width:100%; overflow:hidden; display:flex; align-items:center; gap:8px; min-height:58px; padding:max(8px,env(safe-area-inset-top)) 8px 7px; border-bottom:1px solid var(--line); background:#081522eF; backdrop-filter:blur(14px); z-index:3; }
    .icon { width:40px; height:40px; border:1px solid var(--line); border-radius:12px; background:var(--panel2); color:var(--text); font-size:20px; }
    .brand { min-width:0; flex:1; }
    .brand strong { display:block; color:var(--accent); font-family:var(--hz-font-display,ui-monospace,monospace); letter-spacing:.13em; font-size:15px; }
    #subtitle { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:12px; margin-top:2px; }
    #newChat { width:auto; padding:0 13px; color:var(--accent); font-weight:700; }
    #modebar { width:100%; min-width:0; max-width:100%; display:flex; gap:7px; overflow-x:auto; overflow-y:hidden; padding:8px 10px; border-bottom:1px solid #172b3e; scrollbar-width:none; background:#08131f; }
    .mode { flex:0 0 auto; border:1px solid var(--line); border-radius:999px; padding:7px 11px; background:#0e1e2f; color:var(--muted); font-family:var(--hz-font-display,ui-monospace,monospace); font-size:12px; font-weight:600; }
    .mode.active { border-color:var(--accent); color:#fff; background:#0b5362; }
    #messages { width:100%; min-width:0; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; padding:18px 12px 22px; scroll-behavior:smooth; }
    #welcome { max-width:620px; margin:10vh auto 0; text-align:center; color:var(--muted); line-height:1.55; }
    #welcome .mark { width:54px; height:54px; display:grid; place-items:center; margin:0 auto 14px; border:1px solid #277083; border-radius:17px; color:var(--accent); background:#0a2736; font-size:25px; font-weight:800; }
    #welcome h1 { margin:0 0 8px; color:var(--text); font-size:23px; }
    #welcome p { margin:0; }
    .row { display:flex; width:100%; min-width:0; max-width:760px; margin:0 auto 16px; }
    .row.user { justify-content:flex-end; }
    .bubble { min-width:0; max-width:min(88%,680px); border:1px solid var(--line); border-radius:17px 17px 17px 5px; padding:11px 13px; background:#0e1c2b; line-height:1.48; overflow-wrap:anywhere; word-break:break-word; white-space:pre-wrap; }
    .user .bubble { border-color:#176c7b; border-radius:17px 17px 5px 17px; background:#0b5362; color:#fff; }
    .assistant .bubble { box-shadow:inset 3px 0 var(--accent2); }
    .bubble pre { display:block; width:100%; max-width:100%; overflow:auto; margin:9px 0 2px; padding:10px; border:1px solid #293f55; border-radius:9px; background:#040b12; color:#dceaf5; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; }
    .meta { color:var(--muted); font-size:11px; margin:0 0 5px 4px; }
    .thinking .bubble { width:min(92%,680px); color:var(--muted); }
    .progress-title { color:var(--accent); font-weight:700; margin-bottom:7px; }
    .progress-events { max-height:150px; overflow:auto; font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; color:#a9bdcf; }
    .dots span { display:inline-block; animation:pulse 1.1s infinite; }.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,70%,100%{opacity:.25}35%{opacity:1}}
    #composer { width:100%; min-width:0; max-width:100%; overflow:hidden; position:relative; z-index:4; padding:8px 8px max(8px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#091522f5; backdrop-filter:blur(14px); }
    .composebox { width:100%; min-width:0; display:flex; align-items:flex-end; gap:8px; max-width:780px; margin:auto; padding:5px 5px 5px 12px; border:1px solid #38516a; border-radius:19px; background:#0d1c2b; box-shadow:0 -4px 24px #0004; }
    #slash { flex:0 0 34px; height:42px; border:0; background:transparent; color:var(--accent); font-size:24px; font-weight:700; }
    #prompt { flex:1 1 0; min-width:0; min-height:42px; max-height:148px; width:0; resize:none; border:0; outline:0; padding:10px 0 8px; background:transparent; color:var(--text); font-size:16px; line-height:1.4; }
    #prompt::placeholder { color:#72889d; }
    #send { flex:0 0 42px; height:42px; border:0; border-radius:14px; background:var(--accent); color:#03202a; font-size:21px; font-weight:900; }
    #send:disabled { opacity:.35; }
    #mic { flex:0 0 42px; height:42px; border:0; border-radius:14px; background:transparent; color:var(--accent); font-size:19px; }
    #mic.recording { background:#ff6b81; color:#fff; animation:mic-pulse 1.1s infinite; }
    @keyframes mic-pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
    #hint { max-width:760px; margin:5px auto 0; padding-left:8px; color:#70879c; font-size:11px; }
    .command-sheet { position:absolute; left:0; right:0; bottom:0; height:min(72vh,620px); max-height:calc(var(--vh) - 18px); display:grid; grid-template-rows:auto auto minmax(0,1fr); transform:translateY(105%); transition:transform .22s ease; border:1px solid var(--line); border-radius:22px 22px 0 0; background:#0b1928; box-shadow:0 -18px 55px #000c; padding:0 9px max(9px,env(safe-area-inset-bottom)); touch-action:none; }
    .open .command-sheet { transform:translateY(0); }
    .drag-handle { min-height:45px; display:grid; place-items:center; cursor:grab; touch-action:none; }
    .drag-handle::before { content:''; width:48px; height:5px; border-radius:99px; background:#587087; }
    .command-search { width:100%; min-width:0; height:44px; border:1px solid var(--line); border-radius:11px; outline:0; padding:0 12px; background:#102338; color:var(--text); font-size:16px; }
    #commandPalette { min-height:0; overflow:auto; overscroll-behavior:contain; padding:7px 0; touch-action:pan-y; }
    .command { width:100%; display:grid; grid-template-columns:94px 1fr; gap:8px; text-align:left; border:0; border-radius:9px; padding:10px; background:transparent; color:var(--text); }
    .command:active,.command.selected { background:#12344a; }
    .command strong { color:var(--accent); }
    .command span { color:var(--muted); font-size:13px; }
    .shade { position:fixed; top:var(--vtop); left:var(--vleft); width:var(--vw); height:var(--vh); overflow:hidden; z-index:9; visibility:hidden; opacity:0; background:#0009; transition:.2s; }
    .shade.open { visibility:visible; opacity:1; }
    .drawer { position:absolute; top:0; bottom:0; left:0; width:min(88vw,370px); transform:translateX(-102%); transition:.22s ease; display:flex; flex-direction:column; background:#091522; border-right:1px solid var(--line); padding:max(14px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
    .open .drawer { transform:none; }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:4px 3px 13px; }
    .drawer h2 { margin:0; color:var(--accent); letter-spacing:.08em; font-size:16px; }
    #history { min-height:0; flex:1; overflow:auto; border-block:1px solid var(--line); padding:9px 0; }
    .history-item { width:100%; display:block; text-align:left; border:0; border-radius:10px; background:transparent; color:var(--text); padding:10px; margin:2px 0; }
    .history-item.active { background:#123044; }
    .history-item small { display:block; color:var(--muted); margin-top:3px; }
    .drawer-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding-top:10px; }
    .drawer-actions button,.drawer-actions a { min-height:41px; display:grid; place-items:center; border:1px solid var(--line); border-radius:10px; background:var(--panel2); color:var(--text); text-decoration:none; }
    .drawer-actions .wide { grid-column:1/-1; }
    .sheet { position:absolute; left:8px; right:8px; bottom:8px; max-height:min(78dvh,650px); overflow:auto; transform:translateY(110%); transition:.22s ease; border:1px solid var(--line); border-radius:18px; background:#0b1928; padding:17px 14px max(15px,env(safe-area-inset-bottom)); }
    .open .sheet { transform:none; }
    .sheet h2 { margin:0 0 15px; }
    .field { margin:13px 0; }
    .field label { display:block; color:var(--muted); font-size:12px; margin-bottom:6px; }
    .field select { width:100%; min-height:45px; border:1px solid var(--line); border-radius:10px; padding:0 10px; background:#102338; color:var(--text); }
    .toggle { display:flex; justify-content:space-between; align-items:center; gap:15px; padding:10px 0; }
    .toggle small { display:block; color:var(--muted); margin-top:3px; }
    .sheet button.close { width:100%; min-height:45px; border:1px solid var(--accent); border-radius:11px; background:#0b5362; color:#fff; font-weight:700; margin-top:10px; }
    @media(min-width:800px){#app{border-inline:1px solid var(--line)}.bubble{max-width:78%}}
    @media(orientation:landscape) and (max-height:640px){header{min-height:44px;padding:4px 7px}.icon{width:35px;height:35px;border-radius:10px;font-size:17px}#newChat{padding-inline:9px}#modebar{display:none}#welcome{margin-top:2vh}#composer{padding-top:5px;padding-bottom:max(4px,env(safe-area-inset-bottom))}#prompt{max-height:82px}#hint{display:none}}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <button class="icon" id="menu" aria-label="Conversations">☰</button>
      <div class="brand"><strong>◆ HERALD</strong><span id="subtitle">connecting to router…</span></div>
      <button class="icon" id="settings" aria-label="Chat settings">⚙</button>
      <button class="icon" id="newChat" aria-label="New chat">New</button>
    </header>
    <nav id="modebar" aria-label="Routing mode"></nav>
    <main id="messages" aria-live="polite">
      <section id="welcome"><div class="mark">H</div><h1>How can Herald help?</h1><p>Chat through the router with persistent memory. Choose a routing mode above, or type <code>/help</code> for controls.</p></section>
    </main>
    <footer id="composer">
      <div class="composebox"><button id="slash" aria-label="Slash commands">/</button><textarea id="prompt" rows="1" enterkeyhint="send" placeholder="Ask Herald to inspect or change code…" autocomplete="off"></textarea><button id="mic" aria-label="Voice input" title="Hold to talk">🎙</button><button id="send" aria-label="Send message">↑</button></div>
      <div id="hint">Coding agent · filesystem, shell and MCP tools · persistent memory</div>
    </footer>
  </div>

  <div class="shade" id="navShade"><aside class="drawer" role="dialog" aria-label="Conversations">
    <div class="drawer-head"><h2>CONVERSATIONS</h2><button class="icon" data-close="navShade">×</button></div>
    <div id="history"></div>
    <div class="drawer-actions"><button id="drawerNew">New chat</button><button id="clearChat">Clear memory</button><button id="usage">Usage</button><button id="tools">Tools</button><a class="wide" href="/mobile/terminal">Advanced terminal</a></div>
  </aside></div>

  <div class="shade" id="settingsShade"><section class="sheet" role="dialog" aria-label="Chat settings">
    <h2>Chat settings</h2>
    <div class="field"><label for="modeSelect">Routing behavior</label><select id="modeSelect"></select></div>
    <div class="field"><label for="modelSelect">Model override (Auto preserves failover)</label><select id="modelSelect"><option value="auto">Auto router</option></select></div>
    <div class="field"><label for="projectSelect">Project tool scope</label><select id="projectSelect"><option value="">Global tools</option></select></div>
    <div class="field" id="partField" hidden><label for="partSelect">Project part</label><select id="partSelect"></select></div>
    <label class="toggle"><span>Allow Herald tools<small>Lets the harness call project/global MCP tools</small></span><input type="checkbox" id="agentic"></label>
    <button class="close" data-close="settingsShade">Done</button>
  </section></div>

  <div class="shade" id="commandShade"><section class="command-sheet" id="commandSheet" role="dialog" aria-label="Herald slash commands">
    <div class="drag-handle" id="commandHandle" aria-label="Drag down to close"></div>
    <input class="command-search" id="commandSearch" type="search" placeholder="Find a command…" autocomplete="off">
    <div id="commandPalette" role="listbox" aria-label="Slash commands"></div>
  </section></div>

  <script>
    const $=id=>document.getElementById(id);
    const els={app:$('app'),messages:$('messages'),welcome:$('welcome'),prompt:$('prompt'),send:$('send'),mic:$('mic'),subtitle:$('subtitle'),history:$('history'),modebar:$('modebar'),modeSelect:$('modeSelect'),modelSelect:$('modelSelect'),projectSelect:$('projectSelect'),partSelect:$('partSelect'),partField:$('partField'),agentic:$('agentic'),palette:$('commandPalette'),commandSearch:$('commandSearch'),commandSheet:$('commandSheet'),commandHandle:$('commandHandle')};
    let voiceMode=localStorage.getItem('herald-voice-mode')==='1';
    const MODES={efficiency:'Free-first · protects paid quotas',balanced:'Balanced · cost and quality',quality:'Quality · strongest available',local:'Local · stays on your machines'};
    const COMMANDS=[['help','Show every Herald command'],['code','Use the coding-model pool'],['reason','Use deep reasoning models'],['fast','Use the fastest model pool'],['mode','Set efficiency, balanced, quality, or local'],['model','Choose a specific model or Auto'],['project','Choose project-scoped tools'],['runs','Show recent background work'],['tools','List tools available to this coding agent'],['status','Show router and backend health'],['usage','Show CLI quotas and router usage'],['accounts','Show login and account status'],['login','Open account login controls'],['settings','Open coding-agent settings'],['new','Start a new coding session'],['clear','Clear this session’s memory'],['terminal','Open a native CLI terminal'],['viewport','Show phone layout diagnostics'],['voice','Toggle spoken replies on/off']];
    const CLIENT_VERSION='coding-v1';if(localStorage.getItem('herald-mobile-version')!==CLIENT_VERSION){localStorage.setItem('herald-mobile-version',CLIENT_VERSION);localStorage.setItem('herald-chat-tools','true');localStorage.removeItem('herald-chat-session')}
    let current=localStorage.getItem('herald-chat-session')||'', activeRun=localStorage.getItem('herald-chat-run')||'', mode=localStorage.getItem('herald-chat-mode')||'efficiency', model=localStorage.getItem('herald-chat-model')||'auto', project=localStorage.getItem('herald-chat-project')||'', part=localStorage.getItem('herald-chat-part')||'', busy=false, conversations=[],projects=[];
    const api=async(path,options={})=>{const response=await fetch(path,options);let body={};try{body=await response.json()}catch{}if(!response.ok)throw new Error(body.detail||`Herald returned HTTP ${response.status}`);return body};
    const post=(path,body)=>api(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const stamp=()=>new Date().toISOString().replace(/\D/g,'').slice(0,14)+'_'+Math.random().toString(36).slice(2,7);
    function viewport(){const v=window.visualViewport,h=Math.max(1,Math.min(window.innerHeight,v?v.height:window.innerHeight)),reported=Math.min(window.innerWidth,v?v.width:window.innerWidth),screenWidth=Math.min(screen.width||reported,screen.availWidth||reported),coarse=matchMedia('(pointer: coarse)').matches,w=coarse?Math.min(reported,screenWidth):reported,appWidth=Math.max(280,Math.min(w,1000)),appLeft=Math.max(0,(window.innerWidth-appWidth)/2);document.documentElement.style.setProperty('--vh',`${Math.round(h)}px`);document.documentElement.style.setProperty('--vw',`${Math.round(appWidth)}px`);document.documentElement.style.setProperty('--vtop','0px');document.documentElement.style.setProperty('--vleft',`${Math.round(appLeft)}px`);requestAnimationFrame(()=>scrollBottom(false))}
    function scrollBottom(smooth=true){els.messages.scrollTo({top:els.messages.scrollHeight,behavior:smooth?'smooth':'auto'})}
    function autosize(){els.prompt.style.height='auto';els.prompt.style.height=Math.min(148,Math.max(42,els.prompt.scrollHeight))+'px';els.send.disabled=busy||!els.prompt.value.trim()}
    function openShade(id){$(id).classList.add('open')}
    function closeShade(id){$(id).classList.remove('open')}
    function setMode(next,newIfUsed=true){if(!MODES[next])return;mode=next;localStorage.setItem('herald-chat-mode',mode);els.modeSelect.value=mode;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(newIfUsed&&current)startNew();updateSubtitle()}
    function updateSubtitle(session){const live=session||conversations.find(c=>c.id===current),scope=live?.project?`${live.project}/${live.part}`:(project?`${project}/${part}`:'global tools');els.subtitle.textContent=live?`${live.model} · ${scope} · ${live.turn_count} turn${live.turn_count===1?'':'s'}`:`${model==='auto'?mode:model} · ${scope}`}
    function buildModes(){els.modebar.replaceChildren();els.modeSelect.replaceChildren();for(const [key,desc] of Object.entries(MODES)){const b=document.createElement('button');b.className='mode';b.dataset.mode=key;b.textContent=key[0].toUpperCase()+key.slice(1);b.title=desc;b.onclick=()=>setMode(key);els.modebar.append(b);const o=document.createElement('option');o.value=key;o.textContent=`${b.textContent} — ${desc}`;els.modeSelect.append(o)}setMode(mode,false)}
    function showCommands(query=''){query=String(query).replace(/^\//,'').split(/\s/)[0].toLowerCase();els.palette.replaceChildren();for(const [name,description] of COMMANDS.filter(c=>!query||c[0].startsWith(query))){const b=document.createElement('button');b.className='command';b.innerHTML='<strong></strong><span></span>';b.querySelector('strong').textContent='/'+name;b.querySelector('span').textContent=description;b.onclick=()=>{els.prompt.value='/'+name+(['mode','model','project'].includes(name)?' ':'');closeShade('commandShade');els.commandSearch.value='';autosize();setTimeout(()=>els.prompt.focus(),40)};els.palette.append(b)}openShade('commandShade')}
    function hideCommands(){closeShade('commandShade')}
    function renderText(container,text){const chunks=String(text).split(/```/);chunks.forEach((chunk,i)=>{if(i%2){const pre=document.createElement('pre');pre.textContent=chunk.replace(/^\w+\n/,'');container.append(pre)}else container.append(document.createTextNode(chunk))})}
    function addMessage(role,content,meta=''){els.welcome.hidden=true;const row=document.createElement('section');row.className=`row ${role}`;row.dataset.content=String(content);if(role==='assistant'&&meta){const wrap=document.createElement('div');wrap.style.maxWidth='min(88%,680px)';wrap.style.width='fit-content';const m=document.createElement('div');m.className='meta';m.textContent=meta;const bubble=document.createElement('div');bubble.className='bubble';renderText(bubble,content);wrap.append(m,bubble);row.append(wrap)}else{const bubble=document.createElement('div');bubble.className='bubble';renderText(bubble,content);row.append(bubble)}els.messages.append(row);scrollBottom()}
    function loading(on,title='Herald is routing',events=''){document.querySelector('.thinking')?.remove();if(on){const row=document.createElement('section');row.className='row assistant thinking';const bubble=document.createElement('div');bubble.className='bubble';const heading=document.createElement('div');heading.className='progress-title';heading.textContent=title;const detail=document.createElement('div');detail.className='progress-events';detail.textContent=events||'Starting…';bubble.append(heading,detail);row.append(bubble);els.messages.append(row);scrollBottom(false)}busy=on;autosize()}
    const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    function updateRunProgress(run){const lines=(run.events||[]).slice(-7).map(event=>{const time=new Date(event.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});return `${time}  ${event.message}`});loading(true,`Working in background · ${Math.round(run.elapsed_seconds||0)}s`,lines.join('\n'))}
    async function monitorRun(runId,{restore=false}={}){activeRun=runId;localStorage.setItem('herald-chat-run',runId);let failures=0;while(activeRun===runId){try{const data=await api(`/agent-runs/${runId}`),run=data.run;failures=0;if(restore&&run.prompt){const already=[...document.querySelectorAll('.row.user')].some(row=>row.dataset.content===run.prompt);if(!already)addMessage('user',run.prompt);restore=false}updateRunProgress(run);if(['completed','failed','interrupted'].includes(run.status)){activeRun='';localStorage.removeItem('herald-chat-run');loading(false);if(run.status==='completed'){if(current===run.session_id){await selectConversation(current);if(voiceMode)speakReply()}else systemMessage('Background work completed in another conversation.')}else systemMessage(`Background work ${run.status}.\n\n${run.error||'Open /runs for details.'}`);return}}catch(error){failures++;loading(true,`Reconnecting to background work · attempt ${failures}`,`${error.message}\nHerald is still working on the server; this page will keep trying.`)}await delay(Math.min(5000,1000+failures*750))}}
    function showMessages(messages,session){els.messages.querySelectorAll('.row').forEach(n=>n.remove());els.welcome.hidden=messages.length>0;for(const item of messages)addMessage(item.role,item.content,item.role==='assistant'?(session?.model||'Herald'):'');updateSubtitle(session);scrollBottom(false)}
    async function loadModels(){const data=await api('/v1/models');const old=model;for(const row of data.data||[]){if(row.backend_type==='routing_policy')continue;const o=document.createElement('option');o.value=row.id;o.textContent=`${row.id} · ${row.backend_type}`;els.modelSelect.append(o)}if([...els.modelSelect.options].some(o=>o.value===old))els.modelSelect.value=old;else model='auto'}
    async function loadParts(){els.partSelect.replaceChildren();const row=projects.find(p=>p.name===project);const parts=row?.parts||[];for(const item of parts){const o=document.createElement('option');o.value=item.name;o.textContent=item.name;els.partSelect.append(o)}if(parts.length){if(!parts.some(x=>x.name===part))part=parts[0].name;els.partSelect.value=part}else part='';els.partField.hidden=!project;localStorage.setItem('herald-chat-part',part);updateSubtitle()}
    async function loadProjects(){const data=await api('/projects');projects=[];els.projectSelect.replaceChildren();const globalOption=document.createElement('option');globalOption.value='';globalOption.textContent='Global tools';els.projectSelect.append(globalOption);for(const item of data.projects||[]){let parts=[];try{parts=(await api(`/projects/${encodeURIComponent(item.name)}/parts`)).parts||[]}catch{}projects.push({...item,parts});const o=document.createElement('option');o.value=item.name;o.textContent=`${item.name} (${parts.length} parts)`;els.projectSelect.append(o)}if(!projects.some(x=>x.name===project))project='';els.projectSelect.value=project;await loadParts()}
    function conversationLabel(c){const when=new Date(c.created_at);return `Chat · ${when.toLocaleDateString([], {month:'short',day:'numeric'})} ${when.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`}
    async function loadConversations(){const data=await api('/mobile/api/conversations');conversations=data.conversations||[];els.history.replaceChildren();for(const c of conversations){const b=document.createElement('button');b.className='history-item'+(c.id===current?' active':'');b.innerHTML=`<span></span><small></small>`;b.querySelector('span').textContent=conversationLabel(c);b.querySelector('small').textContent=`${c.model} · ${c.turn_count} turns`;b.onclick=()=>selectConversation(c.id);els.history.append(b)}if(!conversations.length){const p=document.createElement('p');p.style.color='var(--muted)';p.style.padding='10px';p.textContent='Your mobile conversations will appear here.';els.history.append(p)}}
    async function selectConversation(id){const data=await api(`/mobile/api/conversations/${id}`);current=data.session.id;localStorage.setItem('herald-chat-session',current);mode=data.session.mode||mode;project=data.session.project||'';part=data.session.part||'';els.projectSelect.value=project;await loadParts();els.agentic.checked=data.session.agentic!==false;setMode(mode,false);showMessages(data.messages||[],data.session);await loadConversations();closeShade('navShade')}
    function startNew(){current='';localStorage.removeItem('herald-chat-session');showMessages([],null);loadConversations();els.prompt.focus()}
    async function ensureConversation(){if(current)return current;const name='mobile_'+stamp(),scope=project?` Work inside the ${project}/${part} project tool scope.`:' Use the global Herald tool scope.';let instructions,agentic;if(voiceMode){instructions='You are having a spoken conversation, not writing a report. Keep replies short and talk like you would out loud.';try{const persona=await api('/steering/personas/herald');instructions=persona.prompt+'\n\n'+instructions}catch{}agentic=false}else{instructions='You are Herald’s autonomous mobile coding agent. Complete software tasks directly: inspect relevant files, use filesystem and shell tools, edit carefully, run focused tests, and report concrete results. Do not merely describe commands the user asked you to perform.'+scope;agentic=els.agentic.checked}const request={name,memory:name,model,mode:voiceMode?'quality':mode,instructions,agentic,recent_turns:100,ledger_entries:200};if(!voiceMode&&project&&part){request.project=project;request.part=part}const data=await post('/agent-sessions',request);current=data.session.id;localStorage.setItem('herald-chat-session',current);await loadConversations();return current}
    function systemMessage(text){addMessage('assistant',text,'Herald')}
    let voicesReady=null;
    function loadVoices(){if(voicesReady)return voicesReady;voicesReady=new Promise(resolve=>{const existing=speechSynthesis.getVoices();if(existing.length){resolve(existing);return}speechSynthesis.onvoiceschanged=()=>resolve(speechSynthesis.getVoices());setTimeout(()=>resolve(speechSynthesis.getVoices()),1200)});return voicesReady}
    function scoreVoice(v){const name=v.name.toLowerCase();let score=0;if(v.lang.toLowerCase().startsWith((navigator.language||'en').slice(0,2).toLowerCase()))score+=10;if(/natural|neural|premium|enhanced|wavenet|studio/.test(name))score+=8;if(/google/.test(name))score+=4;if(/compact|espeak|festival|robotic/.test(name))score-=6;if(v.default)score+=1;return score}
    async function pickBestVoice(){const voices=await loadVoices();if(!voices.length)return null;return [...voices].sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]}
    async function speakReply(){if(!('speechSynthesis'in window))return;const rows=els.messages.querySelectorAll('.row.assistant');const last=rows[rows.length-1];if(!last)return;speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(last.dataset.content);const voice=await pickBestVoice();if(voice)utter.voice=voice;utter.rate=1.0;utter.pitch=1.0;speechSynthesis.speak(utter)}

    // --- Voice input: records audio + runs the browser's own speech
    // recognizer in parallel, sends both to the server so Whisper and the
    // browser engine can be reconciled rather than trusting either alone.
    let mediaRecorder=null,recordedChunks=[],liveTranscript='',speechRec=null,recordStart=0;
    function pickMimeType(){const candidates=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];for(const type of candidates)if(window.MediaRecorder?.isTypeSupported?.(type))return type;return ''}
    function setupSpeechRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;try{const rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang=navigator.language||'en-US';rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)liveTranscript+=e.results[i][0].transcript+' '};rec.onerror=e=>console.warn('Herald voice: browser speech recognition error',e.error);return rec}catch(error){console.warn('Herald voice: could not init browser speech recognition',error);return null}}
    async function startRecording(){if(mediaRecorder)return;if(!navigator.mediaDevices?.getUserMedia){systemMessage("This browser can't access the microphone here — voice needs HTTPS (this page should already be https://…) and mic permission.");return}if(!window.MediaRecorder){systemMessage("This browser doesn't support audio recording (MediaRecorder unavailable).");return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordedChunks=[];liveTranscript='';const mimeType=pickMimeType();mediaRecorder=mimeType?new MediaRecorder(stream,{mimeType}):new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordedChunks.push(e.data)};mediaRecorder.onerror=e=>console.error('Herald voice: MediaRecorder error',e.error||e);mediaRecorder.start();recordStart=Date.now();speechRec=setupSpeechRecognition();try{speechRec?.start()}catch(error){console.warn('Herald voice: speech recognition start failed',error)}els.mic.classList.add('recording');els.mic.title='Recording — tap to stop';voiceMode=true;localStorage.setItem('herald-voice-mode','1');systemMessage("Listening — tap the mic again when you're done talking.")}catch(error){systemMessage(`Microphone access failed: ${error.name||''} ${error.message}`.trim())}}
    async function stopRecordingAndSend(){if(!mediaRecorder)return;els.mic.classList.remove('recording');els.mic.title='Voice input';const recorder=mediaRecorder,stream=recorder.stream,heldMimeType=recorder.mimeType||'audio/webm';const durationMs=Date.now()-recordStart;const blob=await new Promise(resolve=>{recorder.onstop=()=>resolve(new Blob(recordedChunks,{type:heldMimeType}));try{recorder.requestData()}catch{}recorder.stop()});try{speechRec?.stop()}catch{}stream.getTracks().forEach(t=>t.stop());mediaRecorder=null;console.log(`Herald voice: recorded ${durationMs}ms, blob ${blob.size} bytes, type ${heldMimeType}, browser transcript: "${liveTranscript.trim()}"`);if(durationMs<400){systemMessage("That was too short to catch — hold the mic open a bit longer.");return}if(!blob.size){systemMessage(`No audio was captured (0 bytes recorded over ${Math.round(durationMs/1000)}s). Check that the browser actually has microphone permission for this site.`);return}const form=new FormData();form.append('audio',blob,'clip.webm');if(liveTranscript.trim())form.append('browser_transcript',liveTranscript.trim());loading(true,'Transcribing…','Running every available speech engine');try{const response=await fetch('/voice/transcribe',{method:'POST',body:form});if(!response.ok){loading(false);systemMessage(`Voice transcription failed: server returned HTTP ${response.status}`);return}const data=await response.json();loading(false);console.log('Herald voice: transcribe candidates',data.candidates);if(!data.text){const detail=(data.candidates||[]).map(c=>`${c.engine}: ${c.error||'(empty)'}`).join(' · ');systemMessage(`Didn't catch that — no speech engine returned a transcript.${detail?'\n\n'+detail:''}`);return}els.prompt.value=data.text;autosize();send()}catch(error){loading(false);systemMessage(`Voice transcription failed: ${error.message}`)}}
    els.mic.addEventListener('click',()=>{if(mediaRecorder)stopRecordingAndSend();else startRecording()});
    async function command(text){const [raw,...args]=text.slice(1).trim().split(/\s+/),cmd=raw.toLowerCase();hideCommands();if(cmd==='new'){startNew();return true}if(cmd==='clear'){if(current)await post(`/agent-sessions/${current}/reset`,{force:false});startNew();systemMessage('Conversation memory cleared.');return true}if(['code','reason','fast'].includes(cmd)){model=cmd;localStorage.setItem('herald-chat-model',model);els.modelSelect.value=model;startNew();systemMessage(`New work will use Herald’s ${cmd} routing pool with coding tools enabled.`);return true}if(cmd==='mode'){if(!MODES[args[0]])systemMessage('Modes: efficiency, balanced, quality, local');else{setMode(args[0]);systemMessage(`Routing mode set to ${args[0]}.`)}return true}if(cmd==='model'){if(!args.length)openShade('settingsShade');else{model=args.join(' ');localStorage.setItem('herald-chat-model',model);startNew();systemMessage(`New chats will use ${model}.`)}return true}if(cmd==='project'){if(!args.length){openShade('settingsShade');return true}const value=args.join('/').split('/').filter(Boolean);if(args[0]==='global'){project='';part=''}else{const found=projects.find(x=>x.name===value[0]);if(!found){systemMessage(`Unknown project. Available: ${projects.map(x=>x.name).join(', ')||'none'}`);return true}project=found.name;part=value[1]||found.parts[0]?.name||'';if(!found.parts.some(x=>x.name===part)){systemMessage(`Parts for ${project}: ${found.parts.map(x=>x.name).join(', ')||'none'}`);return true}}localStorage.setItem('herald-chat-project',project);localStorage.setItem('herald-chat-part',part);els.projectSelect.value=project;await loadParts();if(value[1]){part=value[1];els.partSelect.value=part;localStorage.setItem('herald-chat-part',part)}startNew();systemMessage(project?`Coding scope set to ${project}/${part}.`:'Coding scope set to global tools.');return true}if(cmd==='usage'){const data=await api('/usage/all?refresh=true'),quota=[];for(const cli of data.cli_sessions||[])for(const limit of cli.limits||[])quota.push(`${cli.cli} ${limit.name}: ${limit.used_percent??'?'}% used, ${limit.remaining_percent??'?'}% remaining`);const totals=data.totals||{};systemMessage(`Herald usage\n\n${totals.calls||0} router calls · ${totals.input_tokens||0} → ${totals.output_tokens||0} tokens · $${Number(totals.known_cost_usd||0).toFixed(4)} known cost${quota.length?'\n\n'+quota.join('\n'):''}`);return true}if(cmd==='tools'){const suffix=project&&part?`?project=${encodeURIComponent(project)}&part=${encodeURIComponent(part)}`:'';const data=await api('/tools'+suffix);const names=(data.tools||[]).map(x=>`${x.name} — ${x.description||x.instance}`).slice(0,80);systemMessage(names.length?`Coding tools (${names.length}) · ${project?project+'/'+part:'global'}\n\n${names.join('\n')}`:'No callable tools are registered in this scope.');return true}if(cmd==='status'){const data=await api('/backends'),rows=(data.backends||[]).map(x=>`${x.enabled&&!x.circuit_open?'✓':'×'} ${x.name} · ${x.backend_type}${x.circuit_open?' · CIRCUIT OPEN':''}`);systemMessage(`Router backends (${rows.length})\n\n${rows.join('\n')}`);return true}if(cmd==='models'){const data=await api('/v1/models'),rows=(data.data||[]).map(x=>`${x.circuit_open?'×':'✓'} ${x.id} · ${x.backend_type}`);systemMessage(`Models and pools (${rows.length})\n\n${rows.join('\n')}`);return true}if(cmd==='accounts'){const [auth,registered]=await Promise.all([api('/auth/status'),api('/accounts')]),rows=(auth.clis||[]).map(x=>`${x.logged_in||x.status==='ok'?'✓':'×'} ${x.cli} · ${x.detail||x.status||'unknown'}`);systemMessage(`CLI logins\n\n${rows.join('\n')||'No CLI profiles reported.'}\n\nRegistered router accounts: ${(registered.accounts||[]).map(x=>x.name).join(', ')||'none'}`);return true}if(cmd==='login'){location.href='/ui#auth';return true}if(cmd==='settings'){openShade('settingsShade');return true}if(cmd==='viewport'){const v=window.visualViewport;systemMessage(`Viewport diagnostic\n\nwindow: ${window.innerWidth} × ${window.innerHeight}\nvisual: ${Math.round(v?.width||0)} × ${Math.round(v?.height||0)}\nscreen: ${screen.width} × ${screen.height}\norientation: ${screen.orientation?.type||'unknown'}`);return true}if(cmd==='voice'){voiceMode=!voiceMode;localStorage.setItem('herald-voice-mode',voiceMode?'1':'0');if(!voiceMode){speechSynthesis?.cancel();systemMessage('Voice replies are off.')}else{const picked=await pickBestVoice();systemMessage(`Voice replies are on — new chats will use the conversational Herald voice, and finished replies will be spoken aloud${picked?` using "${picked.name}"`:''}.`)}return true}if(cmd==='terminal'){location.href='/mobile/terminal';return true}if(cmd==='help'||cmd==='commands'){systemMessage('Tap the / button to browse commands.\n\n/code, /reason, /fast — routing presets\n/mode — cost and quality policy\n/model — backend override\n/project — project tool scope\n/tools — filesystem, shell, GitHub and MCP tools\n/status, /usage, /accounts — infrastructure\n/login — account console\n/settings — coding-agent controls\n/new, /clear — session memory\n/terminal — native CLI terminal');return true}return false}
    async function send(){const text=els.prompt.value.trim();if(!text||busy)return;els.prompt.value='';hideCommands();autosize();try{if(text.startsWith('/')){if(await command(text))return;systemMessage(`Unknown Herald command: ${text.split(/\s/)[0]}. Tap the / button to see available commands.`);return}addMessage('user',text);loading(true,'Submitting background work','The phone can disconnect after Herald accepts this task.');const id=await ensureConversation();const data=await post(`/agent-sessions/${id}/runs`,{prompt:text,request_id:crypto.randomUUID?.()||stamp()});monitorRun(data.run.id)}catch(error){loading(false);systemMessage(`I couldn't submit that request.\n\n${error.message}`)}}
    $('menu').onclick=()=>openShade('navShade');$('settings').onclick=()=>openShade('settingsShade');$('newChat').onclick=startNew;$('drawerNew').onclick=()=>{startNew();closeShade('navShade')};$('clearChat').onclick=()=>command('/clear');$('usage').onclick=()=>{closeShade('navShade');command('/usage')};$('tools').onclick=()=>{closeShade('navShade');command('/tools')};els.send.onclick=send;
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeShade(b.dataset.close));document.querySelectorAll('.shade').forEach(s=>s.onclick=e=>{if(e.target===s)closeShade(s.id)});
    $('slash').onclick=()=>{if($('commandShade').classList.contains('open'))hideCommands();else{els.prompt.blur();els.commandSearch.value='';showCommands()}};
    els.commandSearch.addEventListener('input',()=>showCommands(els.commandSearch.value));
    els.prompt.addEventListener('input',()=>{autosize();if(els.prompt.value.startsWith('/')&&!$('commandShade').classList.contains('open'))showCommands(els.prompt.value);else if(!els.prompt.value.startsWith('/'))hideCommands()});els.prompt.addEventListener('focus',()=>{setTimeout(()=>{viewport();scrollBottom()},80);setTimeout(()=>{viewport();scrollBottom()},350)});els.prompt.addEventListener('keydown',e=>{if(e.key==='Escape')hideCommands();if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});
    let dragStart=0,dragging=false;els.commandHandle.addEventListener('pointerdown',e=>{dragging=true;dragStart=e.clientY;els.commandSheet.style.transition='none';els.commandHandle.setPointerCapture(e.pointerId)});els.commandHandle.addEventListener('pointermove',e=>{if(!dragging)return;const distance=Math.max(0,e.clientY-dragStart);els.commandSheet.style.transform=`translateY(${distance}px)`});els.commandHandle.addEventListener('pointerup',e=>{if(!dragging)return;const distance=Math.max(0,e.clientY-dragStart);dragging=false;els.commandSheet.style.transition='';els.commandSheet.style.transform='';if(distance>90)hideCommands()});els.commandHandle.addEventListener('pointercancel',()=>{dragging=false;els.commandSheet.style.transition='';els.commandSheet.style.transform=''});
    els.modeSelect.onchange=()=>setMode(els.modeSelect.value);els.modelSelect.onchange=()=>{model=els.modelSelect.value;localStorage.setItem('herald-chat-model',model);if(current)startNew();updateSubtitle()};els.projectSelect.onchange=async()=>{project=els.projectSelect.value;localStorage.setItem('herald-chat-project',project);await loadParts();if(current)startNew()};els.partSelect.onchange=()=>{part=els.partSelect.value;localStorage.setItem('herald-chat-part',part);if(current)startNew();updateSubtitle()};
    window.visualViewport?.addEventListener('resize',viewport);window.visualViewport?.addEventListener('scroll',viewport);window.addEventListener('resize',viewport);window.addEventListener('orientationchange',()=>{viewport();setTimeout(viewport,250);setTimeout(viewport,700)});
    (async()=>{viewport();buildModes();els.agentic.checked=localStorage.getItem('herald-chat-tools')!=='false';els.agentic.onchange=()=>{localStorage.setItem('herald-chat-tools',els.agentic.checked);if(current)startNew()};try{await Promise.all([loadModels(),loadProjects(),loadConversations()]);if(current&&conversations.some(c=>c.id===current))await selectConversation(current);else startNew();els.subtitle.textContent=els.subtitle.textContent.replace('connecting to router…',MODES[mode])}catch(error){els.subtitle.textContent=error.message;systemMessage(`Herald is unavailable.\n\n${error.message}`)}autosize()})();
    COMMANDS.splice(COMMANDS.findIndex(row=>row[0]==='terminal'),0,['reload','Reload updated Herald components']);
    const coreCommand=command;
    command=async function(text){
      const [cmd,...args]=text.slice(1).trim().split(/\s+/);
      if(cmd==='reload'){
        const targets=args.length?args:['router'];
        const data=await post('/control/reload',{targets,delay_seconds:3,force:false});
        systemMessage(`Reload scheduled for ${data.scheduled.join(', ')}. The page will reconnect automatically.`);
        return true;
      }
      if(cmd!=='runs')return coreCommand(text);
      if(!current){systemMessage('Start a conversation before listing its work.');return true}
      const data=await api(`/agent-sessions/${current}/runs?limit=12`),rows=(data.runs||[]).map(run=>{
        const last=(run.events||[]).slice(-1)[0],mark=run.status==='completed'?'✓':run.status==='failed'?'×':'…';
        return `${mark} ${run.status} · ${Math.round(run.elapsed_seconds||0)}s · ${last?.message||run.id.slice(0,8)}`;
      });
      systemMessage(rows.length?`Recent background work\n\n${rows.join('\n')}`:'No background work in this conversation yet.');
      return true;
    };
    if(activeRun)setTimeout(()=>monitorRun(activeRun,{restore:true}),1200);
    if(new URLSearchParams(location.search).get('voice')==='1'&&!voiceMode){
      voiceMode=true;localStorage.setItem('herald-voice-mode','1');
      pickBestVoice().then(picked=>systemMessage(`Voice mode is on — tap the mic to talk${picked?` (replies spoken with "${picked.name}")`:''}.`));
    }
  </script>
